/**:
  ros__parameters:

    control_joints:
      groups:
      - head
      - arm
      head:
        joints_name:
        - head_tilt_joint
        - head_pan_joint
        head_tilt_joint:
          button : 1           # 1 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        head_pan_joint:
          button : 1           # 1 key
          fast_button : 7      # 7 key
          axis : 0             # a, d keys
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
      arm:
        joints_name: 
        - arm_shoulder_1_tilt_joint
        - arm_elbow_upper_1_tilt_joint
        - arm_elbow_lower_tilt_joint
        - arm_elbow_lower_pan_joint
        - arm_wrist_tilt_joint
        arm_shoulder_1_tilt_joint:
          button : 3           # 3 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_elbow_upper_1_tilt_joint:
          button : 3           # 3 key
          fast_button : 7      # 7 key
          axis : 0             # a, d keys
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        arm_elbow_lower_tilt_joint:
          button : 4           # 4 key
          fast_button : 7      # 7 key
          axis : 0             # a, d keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_elbow_lower_pan_joint:
          button : 4           # 4 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_wrist_tilt_joint:
          button : 5           # 5 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5

    control_poses:
      trigger : 8        # 8 key
      poses_name:
        - initial_pose
        - detecting_pose
        - trash_pose
        - navigation_pose
      initial_pose:
        button : 2            # 2 key
      detecting_pose:
        button : 1            # 1 key
      trash_pose:
        button : 0            # 0 key
      navigation_pose:
        button : 3            # 3 key

    control_velocity:
      button : 6            # 6 key
      fast_button : 7       # 7 key
      linear_x_axis : 4     # arrow up, down keys
      linear_y_axis : 3     # arrow left, right keys
      angular_axis : 0      # a, d keys
      axis_sign : 1
      linear_scale : 0.1
      angular_scale : 0.3
      fast_linear_scale : 0.2
      fast_angular_scale : 0.6