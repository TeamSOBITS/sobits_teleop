/**:
  ros__parameters:

    control_joints:
      groups:
      - head
      - arm
      head:
        joints_name:
        - head_camera_tilt_joint
        - head_camera_pan_joint
        head_camera_tilt_joint:
          button : 1           # 1 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        head_camera_pan_joint:
          button : 1           # 1 key
          fast_button : 7      # 7 key
          axis : 0             # a, d keys
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
      arm:
        joints_name: 
        - arm_shoulder_roll_joint
        - arm_shoulder_pitch_joint
        - arm_elbow_pitch_joint
        - arm_forearm_roll_joint
        - arm_wrist_pitch_joint
        - arm_wrist_roll_joint
        arm_shoulder_roll_joint:
          button : 2           # 2 key
          fast_button : 7      # 7 key
          axis : 0             # a, d keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_shoulder_pitch_joint:
          button : 2           # 2 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_elbow_pitch_joint:
          button : 3           # 3 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_forearm_roll_joint:
          button : 3           # 3 key
          fast_button : 7      # 7 key
          axis : 0             # a, d keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_wrist_pitch_joint:
          button : 4           # 4 key
          fast_button : 7      # 7 key
          axis : 1             # w, s keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        arm_wrist_roll_joint:
          button : 4           # 4 key
          fast_button : 7      # 7 key
          axis : 0             # a, d keys
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5

    control_poses:
      trigger : 8        # 8 key
      poses_name:
        - initial_pose
        - detecting_pose
      initial_pose:
        button : 2            # 2 key
      detecting_pose:
        button : 0            # 0 key

    control_velocity:
      button : 6            # 6 key
      fast_button : 7       # 7 key
      linear_x_axis : 4     # arrow up, down keys
      angular_axis : 3      # arrow left, right keys
      axis_sign : 1
      linear_scale : 0.1
      angular_scale : 0.1
      fast_linear_scale : 0.2
      fast_angular_scale : 0.2