/**:
  ros__parameters:
    control_joints:
      groups:
      - head
      - arm
      head:
        joints_name:
        - head_pitch_joint
        - head_yaw_joint
        head_pitch_joint:
          button: 1
          fast_button: 7
          axis: 1
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        head_yaw_joint:
          button: 1
          fast_button: 7
          axis: 0
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
      arm:
        joints_name:
        - arm_shoulder_roll_joint
        - arm_shoulder_pitch_joint
        - arm_elbow_pitch_joint
        - arm_forearm_roll_joint
        - arm_wrist_pitch_joint
        - arm_wrist_roll_joint
        arm_shoulder_roll_joint:
          button: 2
          fast_button: 7
          axis: 0
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        arm_shoulder_pitch_joint:
          button: 2
          fast_button: 7
          axis: 1
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        arm_elbow_pitch_joint:
          button: 3
          fast_button: 7
          axis: 1
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        arm_forearm_roll_joint:
          button: 3
          fast_button: 7
          axis: 0
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        arm_wrist_pitch_joint:
          button: 4
          fast_button: 7
          axis: 1
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        arm_wrist_roll_joint:
          button: 4
          fast_button: 7
          axis: 0
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
    control_poses:
      trigger: 8
      poses:
        poses_name:
        - initial_pose
        - shutdown_pose
        - detecting_pose
        - initial_moving_pose
        initial_pose:
          button: 2
        shutdown_pose:
          button: 1
        detecting_pose:
          button: 0
        initial_moving_pose:
          button: 3
    control_velocity:
      button: 6
      fast_button: 7
      linear_x_axis: 4
      angular_axis: 3
      axis_sign: 1
      linear_scale: 0.1
      angular_scale: 0.1
      fast_linear_scale: 0.2
      fast_angular_scale: 0.2
