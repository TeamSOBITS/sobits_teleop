/**:
  ros__parameters:

    control_joints:
      groups:
      - arm

      arm:
        names:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5

        joint1:
          button: 1           # ○
          fast_button: 4      # L1 (hold for fast_speed)
          axis: 0             # left stick left/right
          axis_sign: 1
          speed: 0.02
          fast_speed: 0.05

        joint2:
          button: 0           # ×
          fast_button: 4      # L1
          axis: 1             # left stick up/down
          axis_sign: -1
          speed: 0.02
          fast_speed: 0.05

        joint3:
          button: 2           # △
          fast_button: 4      # L1
          axis: 1             # left stick up/down
          axis_sign: -1
          speed: 0.02
          fast_speed: 0.05

        joint4:
          button: 3           # □
          fast_button: 4      # L1
          axis: 0             # left stick left/right
          axis_sign: 1
          speed: 0.02
          fast_speed: 0.05

        joint5:
          button: 5           # R1
          fast_button: 4      # L1
          axis: 1             # left stick up/down
          axis_sign: -1
          speed: 0.02
          fast_speed: 0.05
