/**:
  ros__parameters:
    control_joints:
      groups_name:
      - head
      - body
      - arm_left
      - arm_right
      head:
        joints_name:
        - head_camera_tilt_joint
        - head_camera_pan_joint
        head_camera_tilt_joint:
          button: 2
          fast_button: 6
          axis: 1
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
        head_camera_pan_joint:
          button: 2
          fast_button: 6
          axis: 0
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
      body:
        joints_name:
        - body_roll_joint
        body_roll_joint:
          button: 3
          fast_button: 6
          axis: 0
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
      arm_left:
        joints_name:
        - l_arm_shoulder_roll_joint
        - l_arm_shoulder_pan_joint
        - l_arm_elbow_tilt_joint
        - l_arm_wrist_tilt_joint
        l_arm_shoulder_roll_joint:
          button: 1
          fast_button: 6
          axis: 1
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        l_arm_shoulder_pan_joint:
          button: 1
          fast_button: 6
          axis: 0
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
        l_arm_elbow_tilt_joint:
          button: 0
          fast_button: 6
          axis: 0
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
        l_arm_wrist_tilt_joint:
          button: 0
          fast_button: 6
          axis: 1
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
      arm_right:
        joints_name:
        - r_arm_shoulder_roll_joint
        - r_arm_shoulder_pan_joint
        - r_arm_elbow_tilt_joint
        - r_arm_wrist_tilt_joint
        r_arm_shoulder_roll_joint:
          button: 1
          fast_button: 6
          axis: 4
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
        r_arm_shoulder_pan_joint:
          button: 1
          fast_button: 6
          axis: 3
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
        r_arm_elbow_tilt_joint:
          button: 0
          fast_button: 6
          axis: 3
          axis_sign: 1
          speed: 0.1
          fast_speed: 0.5
        r_arm_wrist_tilt_joint:
          button: 0
          fast_button: 6
          axis: 4
          axis_sign: -1
          speed: 0.1
          fast_speed: 0.5
    control_poses:
      trigger: 8
      poses:
        poses_name:
        - initial_pose
        - detecting_pose
        initial_pose:
          button: 2
        detecting_pose:
          button: 0
    control_velocity:
      enable_button: 5
      fast_enable_button: 7
      axis_sign: 1
      linear:
        x_axis: 1
        scale: 0.2
        fast_scale: 0.6
      angular:
        axis: 0
        scale: 0.2
        fast_scale: 0.6
