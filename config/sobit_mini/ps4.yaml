/**:
  ros__parameters:

    control_joints:
      groups:
      - head
      - body
      - arm_left
      - arm_right
      head:
        names:
        - head_camera_tilt_joint
        - head_camera_pan_joint
        head_camera_tilt_joint:
          button : 2           # △
          fast_button : 6      # L2
          axis : 1             # 左スティック上下
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        head_camera_pan_joint:
          button : 2           # △
          fast_button : 6      # L2
          axis : 0             # 左スティック左右
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
      body:
        names:
        - body_roll_joint
        body_roll_joint:
          button : 3           # □
          fast_button : 6      # L2
          axis : 0             # 左スティック左右
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
      arm_left:
        names:
        - l_arm_shoulder_roll_joint
        - l_arm_shoulder_pan_joint
        - l_arm_elbow_tilt_joint
        - l_arm_wrist_tilt_joint
        l_arm_shoulder_roll_joint:
          button : 1           # ◯
          fast_button : 6      # L2
          axis : 1             # 左スティック上下
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        l_arm_shoulder_pan_joint:
          button : 1           # ◯
          fast_button : 6      # L2
          axis : 0             # 左スティック左右
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        l_arm_elbow_tilt_joint:
          button : 0           # ✕
          fast_button : 6      # L2
          axis : 0             # 左スティック左右
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
        l_arm_wrist_tilt_joint:
          button : 0           # ✕
          fast_button : 6      # L2
          axis : 1             # 左スティック上下
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5
      arm_right:
        names:
        - r_arm_shoulder_roll_joint
        - r_arm_shoulder_pan_joint
        - r_arm_elbow_tilt_joint
        - r_arm_wrist_tilt_joint
        r_arm_shoulder_roll_joint:
          button : 1           # ◯
          fast_button : 6      # L2
          axis : 4             # 右スティック上下
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        r_arm_shoulder_pan_joint:
          button : 1           # ◯
          fast_button : 6      # L2
          axis : 3             # 右スティック左右
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        r_arm_elbow_tilt_joint:
          button : 0           # ✕
          fast_button : 6      # L2
          axis : 3             # 右スティック左右
          axis_sign : 1
          speed : 0.1
          fast_speed : 0.5
        r_arm_wrist_tilt_joint:
          button : 0           # ✕
          fast_button : 6      # L2
          axis : 4             # 右スティック上下
          axis_sign : -1
          speed : 0.1
          fast_speed : 0.5

    control_poses:
      trigger : 8        # shareボタン
      pose_list:
        - initial_pose
        - detecting_pose
      initial_pose:
        button : 2            # △ボタン
      detecting_pose:
        button : 0            # ✕ボタン

    control_velocity:
      button : 5            # R1
      fast_button : 7       # R2
      linear_x_axis : 1     # 左スティック上下
      angular_axis : 0      # 左スティック左右
      axis_sign : 1
      linear_scale : 0.1
      angular_scale : 0.3
      fast_linear_scale : 0.2
      fast_angular_scale : 0.6