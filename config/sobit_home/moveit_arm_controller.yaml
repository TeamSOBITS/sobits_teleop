/**:
  ros__parameters:
    arm_teleop:
      # List of arms to initialise (must match planning group names in SRDF)
      arms:
        - arm_left
        - arm_right

      # ── Per-arm configuration ─────────────────────────────────────────────
      arm_left:
        planning_group: "arm_left"
        # TF frame broadcast by sobits_teleop when Quest left controller is active
        target_frame: "left_target_link"
        # Reference frame used for all TF lookups and plan_to_pose calls
        base_frame: "base_footprint"
        # Direct-publish topic for the arm joint trajectory controller
        trajectory_topic: "arm_left_position_controller/joint_trajectory"

      arm_right:
        planning_group: "arm_right"
        target_frame: "right_target_link"
        base_frame: "base_footprint"
        trajectory_topic: "arm_right_position_controller/joint_trajectory"

      # ── Global tuning parameters ──────────────────────────────────────────

      # Tracking loop frequency [Hz].
      # 30 Hz gives ~33ms cycle budget — easily met now that planning is ~2ms
      # (avoid_collisions=false). Higher rate = more frequent goal updates = lower lag.
      update_rate_hz: 30.0

      # Maximum Cartesian step attempted per control cycle [m].
      # Each cycle plans a hop toward the target, executes it to completion, then
      # plans the next (the arm briefly settles between hops). Larger hops = fewer
      # settle pauses but coarser following; smaller = tighter but more move-stop
      # feel. 0.15 m tracks real hand motion to a few cm.
      max_cartesian_step_m: 0.15

      # Cartesian path interpolation resolution [m].
      # 3 cm = ~3x fewer IK calls vs the old 1 cm default, cutting plan time significantly.
      # Still fine enough for smooth robot motion.
      eef_step_m: 0.03

      # Minimum fraction of the Cartesian path that must be computable before
      # the trajectory is submitted.  Lower = arm keeps moving even near limits.
      min_cartesian_fraction: 0.2

      # Replan whenever the target moves more than this from the last submitted goal [m].
      # 1 cm = tight tracking; arm follows the target in near-real-time.
      replan_threshold_m: 0.01

      # Cancel a currently-executing trajectory and replan when the target has moved
      # more than this from the last submitted goal [m].
      # Larger than replan_threshold_m: interrupting a running trajectory causes an
      # abrupt stop. Kept WELL ABOVE max_cartesian_step_m on purpose: with small
      # streamed hops, a low preempt threshold cancels every hop before it finishes
      # (the arm just churns in place and crawls). At 0.30 m, hops complete and chain
      # smoothly; preemption only kicks in if the target teleports far (>30 cm).
      preempt_threshold_m: 0.30

      # Do not replan when EE is already within this distance of target [m].
      arrival_threshold_m: 0.03

      # Angular counterparts of the thresholds above [rad]. The tracker follows
      # target ORIENTATION as well as position: arrival, replan and preempt each
      # trigger if EITHER the position OR the orientation differs by more than its
      # threshold. Without these a pure rotation of the target (hand twisting in
      # place) would be ignored, since position alone reads as "already arrived".
      arrival_threshold_rad: 0.05   # ~3 deg
      replan_threshold_rad:  0.05   # ~3 deg
      preempt_threshold_rad: 0.26   # ~15 deg

      # Velocity and acceleration scaling factors [0, 1] passed to TOTG.
      # 0.8 = 80% of max. Higher = less tracking lag (each hop completes sooner),
      # at the cost of faster/jerkier joint motion. Drop toward 0.5 if the physical
      # arm is too aggressive; raise toward 1.0 for tighter following in sim.
      velocity_scaling: 0.8
      acceleration_scaling: 0.8

      # Milliseconds added to the trajectory header stamp before publishing.
      # Gives the controller a head-start to pre-buffer the trajectory,
      # eliminating the stall between the end of one trajectory and the next.
      traj_lookahead_ms: 40

      # OMPL planning timeout [s] used in the Cartesian fallback path.
      # When computeCartesianPath fraction < min_cartesian_fraction, we fall back
      # to OMPL joint-space planning to cross singularities/out-of-workspace regions.
      ompl_planning_timeout_s: 0.5

      # Collision-check the Cartesian path against the planning scene.
      # false makes computeCartesianPath ~30x faster (pure IK interpolation, no
      # scene checks) — essential for responsive teleop. Safe here because teleop
      # is operator-driven; the arm will NOT auto-avoid obstacles or self-collision.
      # Set true to restore collision avoidance at the cost of ~100 ms/plan latency.
      avoid_collisions: false

      # Settling delay after cancelling a running trajectory before sending the
      # next one [ms]. Kept small so a moving target is followed without stalling
      # a whole control cycle on every preemption.
      preempt_settle_ms: 10
