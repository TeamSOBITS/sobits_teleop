/**:
  ros__parameters:
    arm_teleop:
      # Plan-and-replace arm-tracking backend — tuning only. Arm identity comes
      # from quest.yaml/robot.yaml via arm_backend_plan.launch.py.

      # Tracking loop frequency [Hz]. Replans are velocity-continuous (Ruckig),
      # so a high rate no longer causes the old restart-from-rest crawl.
      update_rate_hz: 50.0

      # Max Cartesian step per cycle [m]. Keep short enough to mostly execute
      # within one replan cycle, else the arm crawls then lurches on release.
      max_cartesian_step_m: 0.10

      # Cartesian interpolation resolution [m]; keeps each hop to a few waypoints.
      eef_step_m: 0.02

      # Min computable fraction of the Cartesian path before submitting.
      # Lower = arm keeps moving even near limits.
      min_cartesian_fraction: 0.2

      # Replan when the target moves this far from the last goal [m].
      # Key anti-crawl knob: too small and the arm never reaches cruise speed.
      replan_threshold_m: 0.03

      # Cancel a running trajectory and replan past this distance [m]. Kept well
      # above max_cartesian_step_m so hops complete; only fires on target teleports.
      preempt_threshold_m: 0.30

      # Do not replan when EE is already within this distance of target [m].
      arrival_threshold_m: 0.03

      # Angular counterparts [rad]: arrival/replan/preempt fire on position OR
      # orientation, else a pure rotation of the target would be ignored.
      arrival_threshold_rad: 0.05   # ~3 deg
      replan_threshold_rad:  0.05   # ~3 deg
      preempt_threshold_rad: 0.26   # ~15 deg

      # TOTG scaling [0, 1]. Acceleration must be high or hops never finish
      # before being replaced (crawl); velocity sets chase speed.
      velocity_scaling: 0.90
      acceleration_scaling: 0.80

      # Seed-sampling lookahead [ms]: budgets planning/transport latency so each
      # hop stays velocity-continuous. Action mode also stamps goals ahead by this.
      traj_lookahead_ms: 40

      # OMPL timeout [s] for the joint-space fallback (crossing singularities).
      ompl_planning_timeout_s: 0.5

      # false = ~30x faster planning (pure IK, no scene checks) — the arm will
      # NOT auto-avoid obstacles or self-collision; operator-driven teleop only.
      avoid_collisions: false

      # Settling delay after a cancel before the next goal [ms]. (Action mode only.)
      preempt_settle_ms: 10

      # topic  = publish trajectories directly; each replaces the last mid-flight (best for teleop).
      # action = FollowJointTrajectory with cancel-based preemption; stalls under fast updates.
      publish_mode: topic
