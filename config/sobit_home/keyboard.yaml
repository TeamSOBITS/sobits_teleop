poses:
  initial_pose:
    pose_button: [8, 2]            # 8, 2
  ninja_pose:
    pose_button: [8, 1]            # 8, 1
  detecting_high_pose:
    pose_button: [8, 0]            # 8, 0
  pre_manipulation_pose:
    pose_button: [8, 3]            # 8, 3

cmd_vel:
  cmd_vel_topic: "/sobit_home/cmd_vel"
  mode_button: 5            # 5
  fast_mode_button: 7       # 7
  linear_x_axis: 4          # arrow up, down keys
  linear_y_axis: 3          # arrow left, right keys
  angular_axis: 0           # a, d keys
  axis_sign: 1
  linear_scale: 0.1
  angular_scale: 0.1
  fast_linear_scale: 0.2
  fast_angular_scale: 0.2