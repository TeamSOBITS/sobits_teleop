/**:
  ros__parameters:
    # Main teleop control-loop frequency [Hz]. Drives how often joystick input
    # is sampled and joint/pose/cmd_vel commands are published.
    teleop_rate_hz: 100.0
    robot_topic_name:
      # Frame Quest tracking resolves in; must be fixed to the arm's root.
      base_frame: base_footprint
      joint_states_topic: joint_states
      joint_trajectory_topic:
        head: head_position_controller/joint_trajectory
        body: body_position_controller/joint_trajectory
        arm_left: arm_left_position_controller/joint_trajectory
        arm_right: arm_right_position_controller/joint_trajectory
        hand_left: hand_left_position_controller/joint_trajectory
        hand_right: hand_right_position_controller/joint_trajectory
      cmd_vel_topic: cmd_vel