/**/servo_target_bridge:
  ros__parameters:
    servo_bridge:
      # List of arms this bridge instance manages.
      arms:
        - arm_right
        - arm_left

      # Rate of the single shared pose-publish timer [Hz]. Servo's
      # incoming_command_timeout (servo_arm_*.yaml) is 0.5 s, so this must stay
      # comfortably above 2 Hz; 100 Hz matches the plan's bridge streaming rate.
      pose_rate_hz: 100.0

      # ── Per-arm configuration ─────────────────────────────────────────────
      # Frame keys use the same vocabulary as quest.yaml's quest_control blocks.
      # end_effector_frame_name: the robot link that FOLLOWS the target (same
      #   meaning as in quest.yaml). servo 2.12.4 drives the planning group's
      #   last SRDF link — hand_*_end_effector_link here — so with this value
      #   no correction is applied (verified in sim 2026-07-15, 0.0 mm).
      # servo_ee_frame: only set if servo drives a DIFFERENT link than
      #   end_effector_frame_name (e.g. the SRDF group changes); the bridge
      #   then re-expresses each target for the servo frame per tick. Empty =
      #   servo drives end_effector_frame_name itself.
      # reach_origin_frame / max_reach: targets farther than max_reach from the
      # shoulder are pulled back onto that sphere before reaching servo.
      # Chasing an out-of-reach hand otherwise straightens the elbow — a true
      # singularity where servo latches an emergency stop that only an external
      # joint move can clear (observed in quest teleop 2026-07-16). Measured
      # full reach shoulder->EE at near-straight elbow: 1.11 m.
      arm_right:
        target_frame_name: right_target_link
        base_frame_name: base_footprint
        end_effector_frame_name: hand_right_end_effector_link
        servo_ee_frame: ""
        servo_node: servo_arm_right
        enable_topic: arm_right/moveit_track_enabled
        reach_origin_frame: arm_right_shoulder_tilt_link
        max_reach: 1.10

      arm_left:
        target_frame_name: left_target_link
        base_frame_name: base_footprint
        end_effector_frame_name: hand_left_end_effector_link
        servo_ee_frame: ""
        servo_node: servo_arm_left
        enable_topic: arm_left/moveit_track_enabled
        reach_origin_frame: arm_left_shoulder_tilt_link
        max_reach: 1.10
