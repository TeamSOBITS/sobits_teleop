## MoveIt Servo backend configuration — one file, three nodes
## (servo_arm_right, servo_arm_left, servo_target_bridge).
##
## Holds ONLY tuning. Everything identity-shaped (which arms, planning
## groups, controller topics, target/EE frames) lives in quest.yaml and
## robot.yaml and is injected per node by servo_arms.launch.py.
##
## Servo parameter names verified against the installed servo 2.12.4 schema
## (/opt/ros/jazzy/share/moveit_servo/config/servo_parameters.yaml); servo_node
## reads them under the "moveit_servo" prefix, hence that namespace is
## required, not flat.

/**:
  ros__parameters:
    # ── Shared moveit_servo tuning (both arm instances) ─────────────────────
    moveit_servo:
      publish_period: 0.02                 # 50 Hz command output
      max_expected_latency: 0.1
      command_in_type: "speed_units"
      scale:
        linear: 1.5                        # max EE m/s — 0.6 felt sluggish in quest teleop (hand scale amplifies target speed); URDF joint velocity limits still cap output
        rotational: 3.0                    # max EE rad/s
        joint: 1.0
      incoming_command_timeout: 0.5        # bridge streams at 100 Hz; halt if it stops

      pose_tracking:
        linear_tolerance: 0.001            # 1 mm
        angular_tolerance: 0.01            # ~0.6 deg

      command_out_type: trajectory_msgs/JointTrajectory
      publish_joint_positions: true
      # MUST be false: Servo emits a single-point JointTrajectory; with velocities
      # published, that point carries a nonzero terminal velocity, and this
      # robot's JointTrajectoryController (allow_nonzero_velocity_at_trajectory_end
      # = false) silently REJECTS any trajectory whose last point has nonzero
      # velocity — the arm never moves. Position-only points execute correctly.
      publish_joint_velocities: false
      publish_joint_accelerations: false

      joint_topic: joint_states            # relative -> /sobit_home/joint_states

      is_primary_planning_scene_monitor: false   # move_group owns the scene
      monitored_planning_scene_topic: /sobit_home/monitored_planning_scene

      check_collisions: true
      collision_check_rate: 10.0
      self_collision_proximity_threshold: 0.004   # 0.01 kept the arm in permanent decel-crawl whenever hand near torso in quest teleop
      scene_collision_proximity_threshold: 0.008
      check_octomap_collisions: false

      # ButterworthFilterPlugin (not AccelerationLimited) because
      # robot_description_planning acceleration limits may be incomplete on this
      # robot; Butterworth needs none.
      use_smoothing: true
      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

      # Home pose is a wrist singularity (wrist_tilt=0 aligns the roll axes), so
      # with the default-ish 10/30 thresholds servo spent whole tracking runs
      # "decelerating". Raised so deceleration only kicks in when genuinely
      # close to singular.
      lower_singularity_threshold: 50.0
      hard_stop_singularity_threshold: 200.0   # 1000 (=disabled) let servo push THROUGH wrist singularities: joint velocities exploded and wound all 7 joints to their bounds. 200 + the bridge reach-clamp is the balance: clamp prevents the unreachable-target freeze, hard stop prevents windup.
      # The arm's HOME config rests exactly on two URDF limits
      # (upper_roll at lower=-1.5708, upper_flex at upper=0). A 0.1 rad margin
      # puts those joints permanently inside the forbidden band, and the servo
      # default halt_all_joints_in_joint_limit=true then froze the WHOLE arm on
      # every tick that nudged either joint limit-ward. Small margin +
      # per-joint halt keeps the rest tracking.
      joint_limit_margins: [0.02]
      halt_all_joints_in_joint_limit: false

    # ── Target bridge ───────────────────────────────────────────────────────
    servo_bridge:
      # (The arm list, planning groups, controller topics and target/EE frames
      # are injected by servo_arms.launch.py from quest.yaml / robot.yaml —
      # those files are the single source of arm identity.)

      # Rate of the single shared pose-publish timer [Hz]. Must stay comfortably
      # above 1/incoming_command_timeout; 100 Hz matches the migration plan.
      pose_rate_hz: 100.0

      # Reach clamp radius [m], shared by all arms (per-arm max_reach overrides).
      # Targets farther than this from the arm's shoulder are pulled back onto
      # the sphere before reaching servo: chasing an out-of-reach hand otherwise
      # straightens the elbow — a true singularity where servo latches an
      # emergency stop that only an external joint move can clear (observed in
      # quest teleop 2026-07-16). Full reach at near-straight elbow: 1.11 m.
      max_reach: 1.10

      # Per-arm keys all default by convention from the arm name (arm_right ->
      # right_target_link, hand_right_end_effector_link, base_footprint,
      # arm_right_shoulder_tilt_link, arm_right/moveit_track_enabled,
      # servo_arm_right). Only set a key here to BREAK the convention:
      #   target_frame_name / base_frame_name / end_effector_frame_name
      #   (same vocabulary as quest.yaml), servo_ee_frame (only if servo
      #   drives a different link than end_effector_frame_name — the bridge
      #   then re-expresses targets for the servo frame each tick),
      #   servo_node, enable_topic, reach_origin_frame, max_reach.
      # servo 2.12.4 drives the planning group's last SRDF link
      # (hand_*_end_effector_link here) — verified in sim 2026-07-15, 0.0 mm.
