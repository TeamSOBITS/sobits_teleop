/**:
  ros__parameters:

    # Press X (left controller) on its own to return the robot to its initial
    # pose. "trigger" is omitted, so no modifier button is required.
    # pose_name is resolved server-side by the move_to_pose action, so this
    # block works for any robot that defines a pose of the same name.
    control_poses:
      pose_action : "move_to_pose"   # MoveToPose action server name
      pose_list:
        - vla_pose_on_table
      vla_pose_on_table:
        button : 0            # X button (left controller)

    quest_control:
      controllers:
      - head
      # - right   # disabled: hardware off
      - left

      head:
        vertical: "head_tilt_joint"
        horizontal: "head_pan_joint"
        # body_lift: "body_lift_joint"  # disabled: hardware off
        head_enable_axis: 2   # left trigger
        vertical_sign: 1
        horizontal_sign: 1
        scale: 1.0

      right:
        arm: "arm_right"
        base_frame_name: "body_link"
        end_effector_frame_name: "hand_right_end_effector_link"
        target_frame_name: "right_target_link"
        arm_enable_axis: 7    # right grip
        scale: 2.0           # anatomical ratio is 1.41; raised to 2.0 for reach
        arm_proximity_threshold: 0.0        # m; 0 = latch immediately on enable
        arm_proximity_angle_threshold: 0.0  # rad; 0 = latch immediately on enable
        gripper:
          hand: "hand_right"
          hand_pose_button: 6       # B button: toggle open/grasp pose
          hand_pose_open: "two_fingers_open_pose"
          hand_pose_close: "two_fingers_grasp_pose"
          hand_pose_action: "move_right_hand_to_pose"
          speed: 0.6                # rad per 50 ms tick at full stick
          single_joint_axis: 5      # in adaptive mode: right stick up/down rotates single_joint_name
          single_joint_name: "hand_right_finger_l_mcp_joint"
          single_joint_sign: -1     # flip stick direction
          single_joint_min: 0.80    # NOT the 3f pose value (0.52): mirror of the
                                    # left hand's spring-capture margin — below
                                    # ~0.55 the gear springs toward ~0.2 where the
                                    # servo cannot jog it back (recover with the
                                    # hand pose button). Margin covers overshoot.
          single_joint_max: 1.575
          adaptive_trigger_axis: 6  # right trigger holds adaptive mode
          adaptive_stick_axis: 4    # right stick left/right
          adaptive_close_sign: -1   # stick right = close
          adaptive_joints:
            names:
            - hand_right_finger_l_pip_joint
            - hand_right_finger_l_dip_joint
            - hand_right_finger_r_pip_joint
            - hand_right_finger_r_dip_joint
            - hand_right_finger_c_mcp_joint
            - hand_right_finger_c_ip_joint
            - hand_right_finger_l_mcp_joint
            hand_right_finger_l_pip_joint:
              close_pos: -0.5
              open_pos: 1.571
            hand_right_finger_l_dip_joint:
              close_pos: -1.571
              open_pos: 0.0
            hand_right_finger_r_pip_joint:
              close_pos: 0.5
              open_pos: -1.571
            hand_right_finger_r_dip_joint:
              close_pos: 1.571
              open_pos: 0.0
            hand_right_finger_c_mcp_joint:
              close_pos: -0.5
              open_pos: 1.571
            hand_right_finger_c_ip_joint:
              close_pos: -1.571
              open_pos: 0.0
            hand_right_finger_l_mcp_joint:
              close_pos: 1.571
              open_pos: 1.571
              fixed: true

      left:
        arm: "arm_left"
        base_frame_name: "body_link"
        end_effector_frame_name: "hand_left_end_effector_link"
        target_frame_name: "left_target_link"
        arm_enable_axis: 7    # right grip
        scale: 2.0           # anatomical ratio is 1.41; raised to 2.0 for reach
        arm_proximity_threshold: 0.0        # m; 0 = latch immediately on enable
        arm_proximity_angle_threshold: 0.0  # rad; 0 = latch immediately on enable
        gripper:
          hand: "hand_left"
          hand_pose_button: 2       # toggle open/grasp pose (NOT X — X is button 0; verify this index via /joy)
          hand_pose_open: "two_fingers_open_pose"
          hand_pose_close: "two_fingers_grasp_pose"
          hand_pose_action: "move_left_hand_to_pose"
          speed: 0.6                # rad per 50 ms tick at full stick
          single_joint_axis: 1      # in adaptive mode: left stick up/down rotates single_joint_name
          single_joint_name: "hand_left_finger_l_mcp_joint"
          single_joint_sign: 1     # flip stick direction
          single_joint_min: -1.575  # functional 2f/3f zone; gear jams outside it
          single_joint_max: -0.80   # NOT the 3f pose value (-0.52): above ~-0.55 a
                                    # spring captures the gear and drags it to ~-0.2
                                    # where the servo cannot jog it back down (only a
                                    # full-hand pose command recovers it). Margin
                                    # covers ~0.05 servo overshoot past the clamp.
          adaptive_trigger_axis: 2  # left trigger holds adaptive mode
          adaptive_stick_axis: 0    # left stick left/right
          adaptive_close_sign: 1    # stick right = close
          adaptive_joints:
            names:
            - hand_left_finger_l_pip_joint
            - hand_left_finger_l_dip_joint
            - hand_left_finger_r_pip_joint
            - hand_left_finger_r_dip_joint
            - hand_left_finger_c_mcp_joint
            - hand_left_finger_c_ip_joint
            - hand_left_finger_l_mcp_joint
            hand_left_finger_l_pip_joint:
              close_pos: -0.5
              open_pos: 1.571
            hand_left_finger_l_dip_joint:
              close_pos: -1.571
              open_pos: 0.0
            hand_left_finger_r_pip_joint:
              close_pos: 0.5
              open_pos: -1.571
            hand_left_finger_r_dip_joint:
              close_pos: 1.571
              open_pos: 0.0
            hand_left_finger_c_mcp_joint:
              close_pos: 0.5
              open_pos: -1.571
            hand_left_finger_c_ip_joint:
              close_pos: 1.571
              open_pos: 0.0
            hand_left_finger_l_mcp_joint:
              close_pos: -1.571
              open_pos: -1.571
              fixed: true
