/**:
  ros__parameters:

    control_velocity:
      control : "axis"      # "button" or "axis"
      axis : 3              # left grip button
      linear_x_axis : 1     # left thumbstick up/down
      linear_y_axis : 0     # left thumbstick left/right
      angular_axis : 4      # right thumbstick left/right
      axis_sign : -1
      linear_scale : 0.1
      angular_scale : 0.3
      fast_linear_scale : 0.2
      fast_angular_scale : 0.6

    quest_control:
      controller:
      - head
      - right
      - left
      head:
        vertical: "head_tilt_joint"
        horizontal: "head_pan_joint"
        body_lift: "body_lift_joint"
        head_mode: 2        # left trigger
        vertical_sign: 1
        horizontal_sign: 1
        scale: 1.0
      right:
        arm: "arm_right"
        base_frame_name: "body_link"
        end_effector_frame_name: "hand_right_end_effector_link"
        target_frame_name: "right_target_link"
        arm_mode: 7         # right grip button
        scale: 2.0       # calibrated: robot arm (1.2926 m) / human arm (0.9150 m)
        arm_proximity_threshold: 0.0        # metres: 0.0 = skip calibration, latch immediately on button press
        arm_proximity_angle_threshold: 0.0  # radians: 0.0 = skip calibration, latch immediately on button press
        gripper:
          hand: "hand_right"
          names:
          - hand_right_finger_l_pip_joint
          - hand_right_finger_l_dip_joint
          - hand_right_finger_c_mcp_joint
          - hand_right_finger_c_ip_joint
          - hand_right_finger_r_pip_joint
          - hand_right_finger_r_dip_joint
          gripper_mode: 6    # right trigger
          hand_pose_button: 6  # right controller B button → toggle two_fingers open/close
          hand_pose_open: "two_fingers_open_pose"
          hand_pose_close: "two_fingers_close_pose"
          hand_pose_action: "move_right_hand_to_pose"
          axis: 4            # right thumbstick left/right
          axis_sign: -1      # 1 : (left : close, right : open), -1 : (left : open, right : close)
          speed: 0.2
          type_axis: 5       # right thumbstick up/down
          type_joint: "hand_right_finger_l_mcp_joint"
          adaptive_trigger_axis: 6   # right trigger axis
          adaptive_stick_axis: 4     # right thumbstick left/right
          adaptive_close_sign: -1    # negative stick = close
          adaptive_joints:
            names:
            - hand_right_finger_l_pip_joint
            - hand_right_finger_l_dip_joint
            - hand_right_finger_r_pip_joint
            - hand_right_finger_r_dip_joint
            - hand_right_finger_c_mcp_joint
            - hand_right_finger_c_ip_joint
            - hand_right_finger_l_mcp_joint
            hand_right_finger_l_pip_joint:
              close_pos: -0.5
              open_pos: 1.571
            hand_right_finger_l_dip_joint:
              close_pos: -1.571
              open_pos: 0.0
            hand_right_finger_r_pip_joint:
              close_pos: 0.5
              open_pos: -1.571
            hand_right_finger_r_dip_joint:
              close_pos: 1.571
              open_pos: 0.0
            hand_right_finger_c_mcp_joint:
              close_pos: -0.5
              open_pos: 1.571
            hand_right_finger_c_ip_joint:
              close_pos: -1.571
              open_pos: 0.0
            hand_right_finger_l_mcp_joint:
              close_pos: 1.571
              open_pos: 1.571
              fixed: true
      left:
        arm: "arm_left"
        base_frame_name: "body_link"
        end_effector_frame_name: "hand_left_end_effector_link"
        target_frame_name: "left_target_link"
        arm_mode: 7           # right grip button
        scale: 2.0         # calibrated: robot arm (1.2926 m) / human arm (0.9150 m)
        arm_proximity_threshold: 0.0        # metres: 0.0 = skip calibration, latch immediately on button press
        arm_proximity_angle_threshold: 0.0  # radians: 0.0 = skip calibration, latch immediately on button press
        gripper:
          hand: "hand_left"
          names:
            - hand_left_finger_l_pip_joint
            - hand_left_finger_l_dip_joint
            - hand_left_finger_c_mcp_joint
            - hand_left_finger_c_ip_joint
            - hand_left_finger_r_pip_joint
            - hand_left_finger_r_dip_joint
          gripper_mode: 2     # left trigger
          hand_pose_button: 2  # left controller button[2] → toggle two_fingers open/close
          hand_pose_open: "two_fingers_open_pose"
          hand_pose_close: "two_fingers_close_pose"
          hand_pose_action: "move_left_hand_to_pose"
          axis: 0             # left thumbstick left/right
          axis_sign: 1        # 1 : (left : close, right : open), -1 : (left : open, right : close)
          speed: 0.2
          type_axis: 1        # left thumbstick up/down
          type_joint: "hand_left_finger_l_mcp_joint"
          adaptive_trigger_axis: 2   # left trigger axis
          adaptive_stick_axis: 0     # left thumbstick left/right
          adaptive_close_sign: 1     # positive stick = close
          adaptive_joints:
            names:
              - hand_left_finger_l_pip_joint
              - hand_left_finger_l_dip_joint
              - hand_left_finger_r_pip_joint
              - hand_left_finger_r_dip_joint
              - hand_left_finger_c_mcp_joint
              - hand_left_finger_c_ip_joint
              - hand_left_finger_l_mcp_joint
            hand_left_finger_l_pip_joint:
              close_pos: -0.5
              open_pos: 1.571
            hand_left_finger_l_dip_joint:
              close_pos: -1.571
              open_pos: 0.0
            hand_left_finger_r_pip_joint:
              close_pos: 0.5
              open_pos: -1.571
            hand_left_finger_r_dip_joint:
              close_pos: 1.571
              open_pos: 0.0
            hand_left_finger_c_mcp_joint:
              close_pos: 0.5
              open_pos: -1.571
            hand_left_finger_c_ip_joint:
              close_pos: 1.571
              open_pos: 0.0
            hand_left_finger_l_mcp_joint:
              close_pos: -1.571
              open_pos: -1.571
              fixed: true