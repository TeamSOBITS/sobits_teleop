/**:
  ros__parameters:

    control_velocity:
      control : "axis"      # "button" or "axis"
      axis : 3              # left grip button
      linear_x_axis : 1     # left thumbstick up/down
      linear_y_axis : 0     # left thumbstick left/right
      angular_axis : 4      # right thumbstick left/right
      axis_sign : -1
      linear_scale : 0.1
      angular_scale : 0.3
      fast_linear_scale : 0.2
      fast_angular_scale : 0.6

    quest_control:
      controller:
      - head
      - right
      - left
      head:
        vertical: "head_tilt_joint"
        horizontal: "head_pan_joint"
        body_lift: "body_lift_joint"
        head_mode: 2        # left trigger
        vertical_sign: 1
        horizontal_sign: 1
        scale: 1.0
      right:
        arm: "arm_right"
        base_frame_name: "body_link"
        end_effector_frame_name: "hand_right_end_effector_link"
        target_frame_name: "right_target_link"
        arm_mode: 7         # right grip button
        scale: 0.7
        gripper:
          hand: "hand_right"
          names:
          - hand_right_finger_l_pip_joint
          - hand_right_finger_l_dip_joint
          - hand_right_finger_c_mcp_joint
          - hand_right_finger_c_ip_joint
          - hand_right_finger_r_pip_joint
          - hand_right_finger_r_dip_joint
          gripper_mode: 6    # right trigger
          axis: 4            # right thumbstick left/right
          axis_sign: -1      # 1 : (left : close, right : open), -1 : (left : open, right : close)
          speed: 0.2
          type_axis: 5       # right thumbstick up/down
          type_joint: "hand_right_finger_l_mcp_joint"
      left:
        arm: "arm_left"
        base_frame_name: "body_link"
        end_effector_frame_name: "hand_left_end_effector_link"
        target_frame_name: "left_target_link"
        arm_mode: 7           # right grip button 
        scale: 0.7
        gripper:
          hand: "hand_left"
          names:
            - hand_left_finger_l_pip_joint
            - hand_left_finger_l_dip_joint
            - hand_left_finger_c_mcp_joint
            - hand_left_finger_c_ip_joint
            - hand_left_finger_r_pip_joint
            - hand_left_finger_r_dip_joint
          gripper_mode: 6     # right trigger
          axis: 0             # left thumbstick left/right
          axis_sign: 1        # 1 : (left : close, right : open), -1 : (left : open, right : close)
          speed: 0.2
          type_axis: 1        # left thumbstick up/down
          type_joint: "hand_left_finger_l_mcp_joint"