/**:
  ros__parameters:

    # Mobile base. Hold left grip to enable; sticks drive. No fast_axis: right
    # grip (7) is taken by both arms' enable_axis.
    control_velocity:
      axis : 3              # left grip
      linear_x_axis : 1     # left stick up/down
      linear_y_axis : 0     # left stick left/right
      angular_axis : 4      # right stick left/right
      axis_sign : -1
      linear_scale : 0.1
      angular_scale : 0.3
      fast_linear_scale : 0.2
      fast_angular_scale : 0.6

    # X sends the pose below. "groups" = publish joint trajectories; omit them to
    # resolve pose_name via MoveToPose. Unlisted joints hold position.
    control_poses:
      pose_action : "move_to_pose"   # MoveToPose action server name (action backend)
      time_from_start : 3.0          # default seconds to reach a pose
      pose_list:
        - initial_pose
      initial_pose:
        button : 0            # X button (left controller)
        # Each entry names a robot.yaml joint group, which supplies the topic.
        groups:
          - head
          - body
          - arm_left
          - arm_right
          - hand_left
          - hand_right
        head:
          joints:    [ head_pan_joint, head_tilt_joint ]
          positions: [ 0.0,            0.0             ]
        body:
          joints:    [ body_lift_joint ]
          positions: [ 0.3             ]
        arm_left:
          joints: [ arm_left_shoulder_tilt_joint, arm_left_upper_roll_joint,
                    arm_left_upper_flex_joint,    arm_left_elbow_joint,
                    arm_left_lower_flex_joint,    arm_left_wrist_tilt_joint,
                    arm_left_wrist_roll_joint ]
          positions: [ -0.75, -1.22, -0.2, 2.5, 0.0, 0.0, 0.0 ]
        arm_right:
          joints: [ arm_right_shoulder_tilt_joint, arm_right_upper_roll_joint,
                    arm_right_upper_flex_joint,    arm_right_elbow_joint,
                    arm_right_lower_flex_joint,    arm_right_wrist_tilt_joint,
                    arm_right_wrist_roll_joint ]
          positions: [ -0.75, -1.22, -0.2, 2.5, 0.0, 0.0, 0.0 ]
        hand_left:
          joints: [ hand_left_finger_c_mcp_joint, hand_left_finger_c_ip_joint,
                    hand_left_finger_l_mcp_joint, hand_left_finger_l_pip_joint,
                    hand_left_finger_l_dip_joint, hand_left_finger_r_pip_joint,
                    hand_left_finger_r_dip_joint ]
          positions: [ -1.57, 0.0, -1.5707, 1.57, 0.0, -1.57, 0.0 ]
        hand_right:
          joints: [ hand_right_finger_c_mcp_joint, hand_right_finger_c_ip_joint,
                    hand_right_finger_l_mcp_joint, hand_right_finger_l_pip_joint,
                    hand_right_finger_l_dip_joint, hand_right_finger_r_pip_joint,
                    hand_right_finger_r_dip_joint ]
          positions: [ 1.57, 0.0, 1.57, 1.57, 0.0, -1.57, 0.0 ]

    quest_control:
      groups:
        - head
        - arm_right
        - hand_right
        - arm_left
        - hand_left

      # controllers: MoveIt/servo backends read only these entries
      controllers:
        - arm_right 
        - arm_left

      head:
        enable_axis: 2        # left trigger
        vertical: "head_tilt_joint"
        horizontal: "head_pan_joint"
        vertical_sign: 1
        horizontal_sign: 1
        motion_scale: 1.0
        body_lift: "body_lift_joint"

      arm_right:
        arm: "arm_right"       # MoveIt planning group name
        controller: "right"
        enable_axis: 7        # right grip
        motion_scale: 2.0     # anatomical ratio is 1.41; raised to 2.0 for reach
        end_effector_frame_name: "hand_right_end_effector_link"
        target_frame_name: "right_target_link"
        proximity_threshold: 0.0        # m; 0 = latch immediately
        proximity_angle_threshold: 0.0  # rad; 0 = latch immediately

      hand_right:
        controller: "right"
        pose_button: 6        # B button: toggle open/grasp pose
        pose_open: "two_fingers_open_pose"
        pose_close: "two_fingers_grasp_pose"
        pose_action: "move_right_hand_to_pose"
        speed: 0.6            # rad per 50 ms tick at full stick
        adaptive:
          trigger_axis: 6     # right trigger holds adaptive mode
          stick_axis: 4       # right stick left/right
          axis_sign: -1       # stick right = close
          names: [ hand_right_finger_l_pip_joint, hand_right_finger_l_dip_joint,
                    hand_right_finger_r_pip_joint, hand_right_finger_r_dip_joint,
                    hand_right_finger_c_mcp_joint, hand_right_finger_c_ip_joint,
                    hand_right_finger_l_mcp_joint ]
          hand_right_finger_l_pip_joint:
            close_pos: -0.5
            open_pos: 1.571
          hand_right_finger_l_dip_joint:
            close_pos: -1.571
            open_pos: 0.0
          hand_right_finger_r_pip_joint:
            close_pos: 0.5
            open_pos: -1.571
          hand_right_finger_r_dip_joint:
            close_pos: 1.571
            open_pos: 0.0
          hand_right_finger_c_mcp_joint:
            close_pos: -0.5
            open_pos: 1.571
          hand_right_finger_c_ip_joint:
            close_pos: -1.571
            open_pos: 0.0
          hand_right_finger_l_mcp_joint:
            close_pos: 1.571
            open_pos: 1.571
            fixed: true
        single_joint:
          name: "hand_right_finger_l_mcp_joint"
          axis: 5
          axis_sign: -1
          min: 0.80   # mirror of the left hand's spring-capture margin
          max: 1.575  # margin covers servo overshoot past the clamp

      arm_left:
        arm: "arm_left"        # MoveIt planning group name
        controller: "left"
        enable_axis: 7        # right grip
        motion_scale: 2.0     # anatomical ratio is 1.41; raised to 2.0 for reach
        end_effector_frame_name: "hand_left_end_effector_link"
        target_frame_name: "left_target_link"
        proximity_threshold: 0.0        # m; 0 = latch immediately
        proximity_angle_threshold: 0.0  # rad; 0 = latch immediately

      hand_left:
        controller: "left"
        pose_button: 2        # toggle open/grasp pose (NOT X — X is button 0; verify via /joy)
        pose_open: "two_fingers_open_pose"
        pose_close: "two_fingers_grasp_pose"
        pose_action: "move_left_hand_to_pose"
        speed: 0.6            # rad per 50 ms tick at full stick
        adaptive:
          trigger_axis: 2     # left trigger holds adaptive mode
          stick_axis: 0       # left stick left/right
          axis_sign: 1        # stick right = close
          names: [ hand_left_finger_l_pip_joint, hand_left_finger_l_dip_joint,
                    hand_left_finger_r_pip_joint, hand_left_finger_r_dip_joint,
                    hand_left_finger_c_mcp_joint, hand_left_finger_c_ip_joint,
                    hand_left_finger_l_mcp_joint ]
          hand_left_finger_l_pip_joint:
            close_pos: -0.5
            open_pos: 1.571
          hand_left_finger_l_dip_joint:
            close_pos: -1.571
            open_pos: 0.0
          hand_left_finger_r_pip_joint:
            close_pos: 0.5
            open_pos: -1.571
          hand_left_finger_r_dip_joint:
            close_pos: 1.571
            open_pos: 0.0
          hand_left_finger_c_mcp_joint:
            close_pos: 0.5
            open_pos: -1.571
          hand_left_finger_c_ip_joint:
            close_pos: 1.571
            open_pos: 0.0
          hand_left_finger_l_mcp_joint:
            close_pos: -1.571
            open_pos: -1.571
            fixed: true
        single_joint:
          name: "hand_left_finger_l_mcp_joint"
          axis: 1
          axis_sign: 1
          min: -1.575  # functional 2f/3f zone; gear jams outside it
          max: -0.80   # spring captures the gear above ~-0.55; margin for overshoot
