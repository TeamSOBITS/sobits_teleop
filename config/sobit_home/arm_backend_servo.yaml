## Servo arm-tracking backend — tuning only; arm identity comes from quest.yaml/robot.yaml.
## Param names per moveit_servo 2.12.4 schema; "moveit_servo" prefix required.

/**:
  ros__parameters:
    # ── Shared moveit_servo tuning (both arm instances) ─────────────────────
    moveit_servo:
      publish_period: 0.02                 # 50 Hz command output
      max_expected_latency: 0.1
      command_in_type: "speed_units"
      scale:
        linear: 1.5                        # max EE m/s — 0.6 felt sluggish in quest teleop (hand scale amplifies target speed); URDF joint velocity limits still cap output
        rotational: 3.0                    # max EE rad/s
        joint: 1.0
      incoming_command_timeout: 0.5        # bridge streams at 100 Hz; halt if it stops

      pose_tracking:
        linear_tolerance: 0.001            # 1 mm
        angular_tolerance: 0.01            # ~0.6 deg

      command_out_type: trajectory_msgs/JointTrajectory
      publish_joint_positions: true
      # must stay false: the arm JTC rejects trajectories ending with nonzero velocity
      publish_joint_velocities: false
      publish_joint_accelerations: false

      joint_topic: joint_states            # relative -> /sobit_home/joint_states

      is_primary_planning_scene_monitor: false   # move_group owns the scene
      monitored_planning_scene_topic: /sobit_home/monitored_planning_scene

      # TEMPORARILY false: the left arm publishes no joint states, so its all-zeros
      # model phantom-halts the right arm. REVERT once left arm hardware is up.
      check_collisions: false
      collision_check_rate: 10.0
      self_collision_proximity_threshold: 0.004   # 0.01 kept the arm in permanent decel-crawl whenever hand near torso in quest teleop
      scene_collision_proximity_threshold: 0.008
      check_octomap_collisions: false

      use_smoothing: true
      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

      # raised: home pose sits near a wrist singularity (10/30 = constant decel)
      lower_singularity_threshold: 50.0
      # do NOT disable: without a hard stop servo winds all joints to their bounds
      hard_stop_singularity_threshold: 200.0
      # small margin + per-joint halt: home pose rests ON two URDF limits
      joint_limit_margins: [0.02]
      halt_all_joints_in_joint_limit: false

    # ── Target bridge ───────────────────────────────────────────────────────
    servo_bridge:
      pose_rate_hz: 100.0   # keep well above 1/incoming_command_timeout

      # Reach clamp [m]: out-of-reach chase = elbow singularity = latched e-stop.
      # Physical reach at near-straight elbow: 1.11 m.
      max_reach: 1.10

      # Halt recovery. Pause servo, drive out in jointspace (no Jacobian, so the
      # singularity cannot block it), then resume servo.
      reset_on_halt: true
      reset_cooldown_s: 2.0   # min gap between recovery attempts
      joint_escape_time_s: 1.0      # escape trajectory duration; 0 disables
      joint_escape_lookback_s: 1.0  # escape to where the arm was this far back
      # Cartesian nudge, only useful before the arm parks ON the singularity.
      escape_step: 0.005      # m per tick toward last healthy pose; 0 disables
      escape_timeout_s: 2.0   # give up after this and tell the operator to re-latch

      # Per-arm keys default by convention from the arm name; set here only to override.

      # Bridge-only names, expanded per arm ({arm}, {side}). The target and EE
      # frames are quest.yaml's, forwarded by the launcher.
      naming:
        reach_origin_frame:      "{arm}_shoulder_tilt_link"
        servo_node:              "servo_{arm}"
        enable_topic:            "{arm}/moveit_track_enabled"
        joint_traj_topic:        "{arm}_position_controller/joint_trajectory"
        status_topic:            "{servo_node}/status"

      # servo_ee_frame stays EMPTY: the group's last link already is the EE link.
      # A wrist override adds the 13 cm hand->wrist offset and lunges at latch.
